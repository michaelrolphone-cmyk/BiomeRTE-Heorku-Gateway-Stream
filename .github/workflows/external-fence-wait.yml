name: Verify external fence wait

on:
  push:
    branches: [main, codex/verified-external-fence-wait-20261120, fo/controller-checkpoint-chunks-20261120]
  pull_request:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify waiting, activation, coordinator and transport
        env:
          PYTHONPATH: tests
        run: python -m unittest -v test_external_fence_wait test_service_activation test_service_coordinator test_service_transport test_checkpoint_service_scope test_public_server test_durable_witness test_witness_deployment test_controller_runtime_transport
