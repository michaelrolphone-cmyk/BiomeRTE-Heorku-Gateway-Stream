name: Verify external fence wait

on:
  push:
    branches: [codex/verified-external-fence-wait-20261120, fo/controller-checkpoint-chunks-20261120]
  pull_request:
    paths:
      - biomerte/service_coordinator.py
      - biomerte/service_transport.py
      - biomerte/checkpoint_transport.py
      - biomerte/durable_witness.py
      - biomerte/public_server.py
      - biomerte/heroku_stream_router.py
      - tests/test_external_fence_wait.py
      - tests/test_service_activation.py
      - tests/test_service_coordinator.py
      - tests/test_service_transport.py
      - tests/test_durable_witness.py
      - tests/test_controller_runtime_transport.py
      - .github/workflows/external-fence-wait.yml

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify waiting, activation, coordinator and transport
        env:
          PYTHONPATH: tests
        run: python -m unittest -v test_external_fence_wait test_service_activation test_service_coordinator test_service_transport test_durable_witness test_controller_runtime_transport
