name: Gateway qualification

on:
  push:
    branches: [main, codex/verified-external-fence-wait-20261120, fo/controller-checkpoint-chunks-20261120]
  pull_request:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify the complete gateway, controller transport and Mac bridge suite
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -v
